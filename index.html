<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoRa Messenger</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b141a; color: #e9edef; height: 100vh; display: flex; flex-direction: column; }
    
    /* Header */
    header { background-color: #202c33; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a3942; }
    .header-info h1 { font-size: 16px; color: #e9edef; font-weight: 600; }
    .header-info p { font-size: 12px; color: #8696a0; }
    .status-online { color: #00a884 !important; }
    .btn-connect { background-color: #00a884; color: #111b21; border: none; padding: 8px 14px; border-radius: 20px; font-weight: 600; font-size: 13px; cursor: pointer; }
    .btn-connect:disabled { background-color: #2a3942; color: #8696a0; }

    /* Area Chat */
    #chat-box { flex: 1; padding: 16px; overflow-y: auto; background-color: #0b141a; display: flex; flex-direction: column; gap: 8px; }
    .message { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; word-wrap: break-word; position: relative; }
    .message.outgoing { background-color: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
    .message.incoming { background-color: #202c33; align-self: flex-start; border-top-left-radius: 0; }
    .message.system { background-color: #182229; color: #ffd279; align-self: center; font-size: 12px; text-align: center; border-radius: 6px; }
    .message.sos { background-color: #7f1d1d; color: #fecaca; align-self: center; font-weight: bold; border: 1px solid #ef4444; width: 90%; text-align: center; }
    .time { font-size: 10px; color: #8696a0; margin-top: 4px; text-align: right; float: right; margin-left: 8px; }

    /* Controls & Input */
    .controls { padding: 8px 12px; background-color: #202c33; display: flex; flex-direction: column; gap: 8px; }
    .quick-actions { display: flex; gap: 8px; }
    .btn-action { flex: 1; background-color: #2a3942; color: #e9edef; border: none; padding: 6px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .btn-sos { background-color: #dc2626; color: white; font-weight: bold; }
    
    .input-group { display: flex; gap: 8px; align-items: center; }
    input[type="text"] { flex: 1; background-color: #2a3942; border: none; color: #e9edef; padding: 10px 14px; border-radius: 8px; font-size: 14px; outline: none; }
    input[type="text"]::placeholder { color: #8696a0; }
    .btn-send { background-color: #00a884; border: none; color: #111b21; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-info">
      <h1>LoRa Field Messenger</h1>
      <p id="status-text">Terputus dari ESP32</p>
    </div>
    <button id="connect-btn" class="btn-connect">Hubungkan</button>
  </header>

  <!-- Box Percakapan -->
  <div id="chat-box">
    <div class="message system">Gunakan Google Chrome / Edge untuk menyambungkan Web BLE ke ESP32.</div>
  </div>

  <!-- Area Input & Pintasan -->
  <div class="controls">
    <div class="quick-actions">
      <button id="gps-btn" class="btn-action">📍 Kirim Lokasi GPS</button>
      <button id="sos-btn" class="btn-action btn-sos">🚨 DARURAT (SOS)</button>
    </div>
    <div class="input-group">
      <input type="text" id="message-input" placeholder="Ketik pesan..." disabled>
      <button id="send-btn" class="btn-send" disabled>Kirim</button>
    </div>
  </div>

  <script>
    // UUID standar BLE Service & Characteristic kita
    const SERVICE_UUID  = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const RX_CHAR_UUID  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // HP -> ESP32
    const TX_CHAR_UUID  = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // ESP32 -> HP

    let rxCharacteristic;
    let txCharacteristic;
    let bluetoothDevice;

    const connectBtn = document.getElementById('connect-btn');
    const statusText = document.getElementById('status-text');
    const chatBox = document.getElementById('chat-box');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const gpsBtn = document.getElementById('gps-btn');
    const sosBtn = document.getElementById('sos-btn');

    // Fungsi Waktu Format HH:MM
    function getFormattedTime() {
      const now = new Date();
      return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // Fungsi Menambahkan Pesan ke Antarmuka
    function appendMessage(text, type) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', type);
      
      if (type === 'system' || type === 'sos') {
        msgDiv.innerText = text;
      } else {
        msgDiv.innerHTML = `${text} <span class="time">${getFormattedTime()}</span>`;
      }
      
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Koneksi Bluetooth BLE
    connectBtn.addEventListener('click', async () => {
      if (!navigator.bluetooth) {
        alert("Browser ini tidak mendukung Web Bluetooth API.");
        return;
      }

      try {
        statusText.innerText = "Mencari perangkat...";
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ services: [SERVICE_UUID] }]
        });

        bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);

        rxCharacteristic = await service.getCharacteristic(RX_CHAR_UUID);
        txCharacteristic = await service.getCharacteristic(TX_CHAR_UUID);

        // Aktifkan Notifikasi untuk Menerima Pesan Masuk
        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingData);

        statusText.innerText = "Terhubung (BLE Active)";
        statusText.classList.add('status-online');
        connectBtn.innerText = "Terhubung";
        connectBtn.disabled = true;

        messageInput.disabled = false;
        sendBtn.disabled = false;

        appendMessage("Berhasil terhubung ke ESP32-C3 via BLE!", "system");

      } catch (error) {
        console.error(error);
        statusText.innerText = "Gagal terhubung";
        appendMessage("Gagal terhubung: " + error.message, "system");
      }
    });

    // Penanganan Terputus
    function onDisconnected() {
      statusText.innerText = "Terputus";
      statusText.classList.remove('status-online');
      connectBtn.innerText = "Hubungkan";
      connectBtn.disabled = false;
      messageInput.disabled = true;
      sendBtn.disabled = true;
      appendMessage("Koneksi Bluetooth terputus.", "system");
    }

    // Mengirim Data via BLE
    async function sendData(text, isSOS = false) {
      if (!rxCharacteristic) return;

      try {
        const encoder = new TextEncoder();
        await rxCharacteristic.writeValue(encoder.encode(text));
        
        if (isSOS) {
          appendMessage("🚨 BAHAYA: Sinyal SOS Dipancarkan! [" + text + "]", "sos");
        } else {
          appendMessage(text, "outgoing");
        }
      } catch (error) {
        console.error("Gagal mengirim:", error);
        appendMessage("Gagal mengirim data via BLE", "system");
      }
    }

    // Menerima Data Masuk dari ESP32-C3 (LoRa Receiver)
    function handleIncomingData(event) {
      const decoder = new TextDecoder('utf-8');
      const receivedText = decoder.decode(event.target.value);
      appendMessage(receivedText, "incoming");
    }

    // Listener Tombol Kirim
    sendBtn.addEventListener('click', () => {
      const text = messageInput.value.trim();
      if (text) {
        sendData(text);
        messageInput.value = '';
      }
    });

    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });

    // Listener Tombol GPS (Menggunakan Geolocation API Smartphone)
    gpsBtn.addEventListener('click', () => {
      if ("geolocation" in navigator) {
        statusText.innerText = "Mendapatkan koordinat GPS...";
        navigator.geolocation.getCurrentPosition(
          (position) => {
            statusText.innerText = "Terhubung (BLE Active)";
            const lat = position.coords.latitude.toFixed(5);
            const lon = position.coords.longitude.toFixed(5);
            const gpsData = `[GPS] Lat: ${lat}, Lon: ${lon}`;
            sendData(gpsData);
          },
          (error) => {
            statusText.innerText = "Terhubung (BLE Active)";
            alert("Gagal mengambil lokasi GPS: " + error.message);
          },
          { enableHighAccuracy: true, timeout: 5000 }
        );
      } else {
        alert("Fitur GPS tidak didukung di browser ini.");
      }
    });

    // Listener Tombol SOS
    sosBtn.addEventListener('click', () => {
      if (confirm("Kirim sinyal DARURAT (SOS) ke semua modul LoRa?")) {
        sendData("SOS! BUTUH BANTUAN SEGERA!", true);
      }
    });
  </script>
</body>
</html>
